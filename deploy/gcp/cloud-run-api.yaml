# Example Cloud Run service — API
# gcloud run services replace deploy/gcp/cloud-run-api.yaml --region=asia-south1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: checkpoint-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      containers:
        - image: gcr.io/PROJECT_ID/checkpoint-platform:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: prod
            - name: RUN_MIGRATIONS
              value: "true"
            - name: CREATE_TOPICS
              value: "false"
            - name: CHECKPOINT_ROOT
              value: /app
            - name: LOG_LEVEL
              value: INFO
            # Set these from Secret Manager in real deploy:
            # DATABASE_URL, KAFKA_*, REDIS_URL, KAFKA_SASL_*
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
