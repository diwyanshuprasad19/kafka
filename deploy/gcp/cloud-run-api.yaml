# Cloud Run service — API (replace PROJECT_ID / image tag before apply)
# Prefer: make -C ../platform-ops deploy REPO=kafka SERVICE=checkpoint-api
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: checkpoint-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/checkpoint-api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: prod
            - name: RUN_MIGRATIONS
              value: "true"
            - name: CREATE_TOPICS
              value: "false"
            - name: CHECKPOINT_ROOT
              value: /app
            - name: LOG_LEVEL
              value: INFO
            - name: LOG_FORMAT
              value: json
            - name: PORT
              value: "8080"
            # Wire via Secret Manager (gcloud run deploy --set-secrets=...):
            # DATABASE_URL, KAFKA_BOOTSTRAP_SERVERS, REDIS_URL, …
            - name: CORS_ORIGINS
              value: ""
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
