# Cloud Build: build + push image (substitute PROJECT_ID)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/checkpoint-platform:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/checkpoint-platform:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/checkpoint-platform:$SHORT_SHA"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/checkpoint-platform:latest"]

images:
  - gcr.io/$PROJECT_ID/checkpoint-platform:$SHORT_SHA
  - gcr.io/$PROJECT_ID/checkpoint-platform:latest

timeout: 1200s
