# Tag-triggered CI/CD — build image + deploy Cloud Run API
substitutions:
  _SERVICE: checkpoint-api
  _REGION: us-central1
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - name: python:3.12-slim
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q -e ".[dev]" ruff
        ruff check src tests || true
        pytest tests/ -q --tb=line

  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-tag
    args: ["push", "gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}"]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args: ["push", "gcr.io/$PROJECT_ID/${_SERVICE}:latest"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    args:
      - gcloud
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --timeout=300
      - --set-env-vars=APP_ENV=prod,LOG_FORMAT=json,RUN_MIGRATIONS=true,CREATE_TOPICS=false,OTEL_SERVICE_NAME=${_SERVICE},CORS_ORIGINS=
      - --quiet

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}
  - gcr.io/$PROJECT_ID/${_SERVICE}:latest

timeout: 1800s
