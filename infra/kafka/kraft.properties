# Single-node Kafka 4.3 in KRaft mode for local development.
#
# This is deliberately not a production cluster: one broker, replication factor 1,
# no authentication. Production would use multiple brokers with RF=3 and TLS/SASL.
# Kept in the repo rather than editing Homebrew's shared server.properties so the
# local setup is reproducible and matches the ports in .env.

process.roles=broker,controller
node.id=1

controller.quorum.bootstrap.servers=localhost:9095
listeners=PLAINTEXT://:9094,CONTROLLER://:9095
# Only the client listener is advertised; the controller listener is internal.
advertised.listeners=PLAINTEXT://localhost:9094
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

log.dirs=.kafka-data

# Matches CHECKPOINT_PARTITIONS in .env, so topics auto-created by a stray client
# still get the partition count the consumer group is sized for.
num.partitions=12

# A single broker cannot replicate internal topics.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1

# No reason to delay the first rebalance locally; makes consumer start-up snappy
# and keeps the rebalance demos quick.
group.initial.rebalance.delay.ms=0

# Local disk is small and these are synthetic events.
log.retention.hours=24
log.segment.bytes=268435456
