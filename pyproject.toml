[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-platform"
version = "0.1.0"
description = "Kafka checkpoint aggregation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.8.0",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "Flask==3.1.3",
    "flask-cors==6.0.0",
    "gunicorn==23.0.0",
    "python-dotenv==1.2.2",
    "prometheus-client==0.21.1",
    "redis==5.2.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "httpx==0.28.1",
    "Werkzeug==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
]

[project.scripts]
checkpoint-api = "checkpoint_platform.interfaces.http.app:main"
checkpoint-consumer = "checkpoint_platform.interfaces.workers.aggregation_consumer:main"
checkpoint-outbox = "checkpoint_platform.interfaces.workers.outbox_publisher:main"
checkpoint-reporting = "checkpoint_platform.interfaces.workers.reporting_consumer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
